<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESH BINGO - SECURE PREMIUM</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        :root { 
            --gold: #ffcc00; --bg: #050a18; --red: #ff3e3e; --green: #00ff88; --orange: #ff8800; --purple: #a855f7;
        }
        body { 
            background: var(--bg); color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; 
        }
        #auth-ui {
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; background: radial-gradient(circle at center, #1e293b, #050a18);
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.03); border: 2px solid var(--gold); border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 360px; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: var(--gold); margin-top: 0; font-size: 1.6rem; letter-spacing: 1px; }
        .input-group { width: 100%; text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        .auth-input { padding: 14px; width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; font-size: 1rem; background: #fff; color: #000; font-weight: bold; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--green), #00cc6a); color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        #main-app-content { display: flex; flex-direction: column; height: 100vh; width: 100vw; box-sizing: border-box; overflow: hidden; }

        .header-banner { 
            background: linear-gradient(145deg, #1e293b, #050a18); padding: 8px 15px; border-bottom: 2px solid var(--gold); 
            display: flex; justify-content: center; align-items: center; gap: 15px; min-height: 45px; box-sizing: border-box;
        }
        .header-banner h1 { margin: 0; font-size: 1.3rem; color: var(--gold); letter-spacing: 2px; }
        
        /* ሪፍሬሽ በተን ስራ እንዲኖረው እና ሪኮኔክት እንዲያደርግ የተስተካከለ */
        .btn-top-refresh {
            background: var(--gold); color: #000; border: 1px solid white; border-radius: 6px; font-size: 0.9rem; font-weight: bold; padding: 6px 12px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .btn-top-refresh:active { transform: scale(0.9); }

        .stats { display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 6px; margin: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .stats div { font-size: 0.75rem; color: #94a3b8; }
        .stats b { display: block; font-size: 0.95rem; color: var(--gold); }
        
        #lobby-ui { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .action-bar { display: flex; justify-content: center; gap: 5px; padding: 4px 8px; flex-wrap: wrap; }
        .btn-main { flex: 1; min-width: 70px; padding: 9px 4px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .btn-deposit { background: var(--green); color: #000; }
        .btn-withdraw { background: var(--orange); color: white; }
        .btn-transfer { background: var(--purple); color: white; }
        .btn-how-to { background: #3b82f6; color: white; }

        /* ዩአይ ወደላይ ወደታች እንዳይል (UI Shaking Fix) ትክክለኛ ቁመት እና ፕሌስመንት ተሰጥቷል */
        .timer-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 10px auto; width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.02); padding: 6px 12px; border-radius: 12px; min-height: 50px; box-sizing: border-box; }
        #timer { font-size: 2rem; font-weight: 900; color: var(--gold); text-align: center; line-height: 1; }
        .buy-notice { font-size: 0.95rem; font-weight: 900; color: var(--green); background: rgba(0, 255, 136, 0.1); padding: 8px 12px; border-radius: 8px; border: 2px dashed var(--green); text-align: center; }

        .grid-500 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; flex: 1; overflow-y: auto; background: #000; padding: 10px; margin: 5px 10px 10px 10px; border-radius: 10px; box-sizing: border-box; }
        .t-box { background: #fff; color: #000; font-size: 0.75rem; padding: 8px 0; font-weight: bold; border-radius: 4px; cursor: pointer; box-sizing: border-box; }
        .t-box.mine { background: var(--gold) !important; color: #000 !important; }
        .t-box.sold { background: #333; color: #666; cursor: not-allowed; }

        #game-ui { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 5px; box-sizing: border-box; }
        .ball-section-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; margin-bottom: 5px; min-height: 70px; }
        .ball-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        #ball-circle { width: 55px; height: 55px; background: radial-gradient(circle, #fff, var(--gold)); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 900; border: 3px solid #1e293b; box-sizing: border-box; }
        
        .game-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; overflow: hidden; width: 100%; box-sizing: border-box; padding: 4px; }
        .board-container { border: 1px solid #333; background: rgba(0,0,0,0.8); border-radius: 8px; padding: 3px; display: flex; flex-direction: column; overflow: hidden; height: 100%; box-sizing: border-box; }
        .board-header { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--gold); color: #000; font-weight: 900; font-size: 0.7rem; padding: 2px 0; border-radius: 4px; margin-bottom: 2px; }
        .main-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; flex: 1; overflow: hidden; }
        .board-column { display: flex; flex-direction: column; gap: 1px; height: 100%; justify-content: space-between; }
        .ball-dot { font-size: 0.65rem; background: #111; padding: 2px 0; color: #444; border-radius: 2px; text-align: center; font-weight: bold; flex: 1; display: flex; align-items: center; justify-content: center; }
        .ball-dot.active { background: var(--gold); color: #000; font-weight: bold; }

        .player-side-area { display: flex; flex-direction: column; justify-content: space-between; height: 100%; overflow: hidden; box-sizing: border-box; }
        #card-area { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 2px; }
        
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #444; padding: 4px; border-radius: 0 0 5px 5px; width: 100%; box-sizing: border-box; }
        .cell { background: #fff; color: #000; height: 33px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; cursor: pointer; border-radius: 3px; }
        .cell.selected { background: var(--gold) !important; color: #000 !important; }
        .cell.free { background: var(--red) !important; color: white; font-size: 0.65rem; }
        
        #bingo-btn { width: 100%; padding: 12px 0; background: var(--red); color: white; font-size: 1.1rem; font-weight: 900; border-radius: 10px; border: 1px solid white; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        #bingo-btn:disabled { background: #555 !important; cursor: not-allowed; }
        
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; flex-direction:column; align-items:center; justify-content:center; padding: 20px; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 15px; width: 92%; max-width: 360px; text-align: left; max-height: 85vh; overflow-y: auto; }
        input { padding: 12px; margin: 10px 0; width: 100%; border-radius: 8px; border: none; box-sizing: border-box; font-size: 1rem; color: #000; }

        .winner-modal { display: none; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5,10,24,0.98), rgba(30,41,59,0.98)); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .winner-box { background: #ffffff; color: #1e293b; width: 92%; max-width: 360px; border-radius: 28px; padding: 20px 15px; box-sizing: border-box; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 4px solid var(--gold); text-align: center; }
        .winner-name-text { font-size: 1.3rem; font-weight: 900; margin: 5px 0; color: #10b981; word-break: break-word; }
        .winner-grid-modern { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #f8fafc; padding: 6px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .w-cell-modern { background: #ffffff; color: #a0aec0; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; border-radius: 8px; border: 1px solid #e2e8f0; }
        .w-cell-modern.hit { background: #ef4444 !important; color: #ffffff !important; }
        .next-round-bar { background: var(--gold); color: #000; font-weight: 900; padding: 12px; width: 92%; max-width: 360px; margin-top: 10px; border-radius: 15px; font-size: 0.95rem; text-transform: uppercase; }
        .waiting-box { color: var(--gold); font-weight: bold; font-size: 0.9rem; padding: 15px 10px; text-align: center; border: 2px dashed var(--gold); border-radius: 12px; background: rgba(255, 204, 0, 0.05); margin-top: 10px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    </style>
</head>
<body>

    <div id="auth-ui">
        <div class="auth-card">
            <h2>ተመዝገብ</h2>
            <p style="color:#94a3b8; font-size:0.9rem;">ወደ ጨዋታው ለመግባት መረጃዎን ያስገቡ</p>
            <div class="input-group">
                <label>የተጫዋች ስም</label>
                <input type="text" id="reg-username" class="auth-input" placeholder="ስምዎን ያስገቡ...">
            </div>
            <div class="input-group">
                <label>የስልክ ቁጥር</label>
                <input type="tel" id="reg-phone" class="auth-input" placeholder="09... ወይም 07...">
            </div>
            <button id="auth-submit-btn" class="btn-login" onclick="registerUser()">🚀 ወደ ጨዋታው ግባ</button>
        </div>
    </div>

    <div id="main-app-content" style="display: none;">
        <audio id="win-horn" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>
        
        <div class="header-banner">
            <h1>BESH BINGO</h1>
            <button class="btn-top-refresh" onclick="forceRecoveryRefresh()">🔄 Refresh</button>
        </div>
        
        <div class="stats">
            <div>BALANCE<b id="balance">0 ETB</b></div>
            <div>PLAYERS<b id="p-count">0</b></div>
            <div>በሽ-ደራሽ<b id="prize">0 ETB</b></div>
        </div>

        <div id="lobby-ui">
            <div class="action-bar">
                <button class="btn-main btn-deposit" onclick="openM('dep-m')">📥 DEPOSIT</button>
                <button class="btn-main btn-transfer" onclick="openM('trans-m')">💸 TRANSFER</button>
                <button class="btn-main btn-withdraw" onclick="openM('with-m')">📤 WITHDRAW</button>
                <button class="btn-main btn-how-to" onclick="openM('guide-m')">📖 GUIDE</button>
            </div>
            <div class="timer-container">
                <div id="timer">30</div>
                <div class="buy-notice">🎟️ ካርቴላ ይግዙ (10 ETB)</div>
            </div>
            <div class="grid-500" id="ticket-area"></div>
        </div>

        <div id="game-ui" style="display:none;">
            <div class="ball-section-wrapper">
                <div class="ball-row">
                    <div id="recent-balls-container"></div>
                    <div id="ball-circle">--</div>
                </div>
            </div>
            <div class="game-layout">
                <div class="board-container">
                    <div class="board-header"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
                    <div class="main-board" id="main-board"></div>
                </div>
                <div class="player-side-area">
                    <div id="card-area"></div>
                    <button id="bingo-btn" onclick="claim()">BINGO!</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ሞዳሎች -->
    <div id="guide-m" class="modal"><div class="modal-content"><h2 style="color:var(--gold);">📖 መመሪያ</h2><p style="font-size:0.9rem;">1. ቢያንስ 2 ተጫዋቾች ያስፈልጋሉ።<br>2. ካርቴላ ይግዙ (10 ብር)።<br>3. መስመር ሲሞላ BINGO ይጫኑ!</p><button class="btn-main" style="width:100%; background:var(--red); color:white; margin-top:15px;" onclick="closeM('guide-m')">እሺ</button></div></div>
    <div id="with-m" class="modal"><div class="modal-content" style="text-align:center;"><h2 style="color:var(--orange);">WITHDRAW</h2><input type="number" id="wa" min="20" placeholder="Amount (ETB)"><button class="btn-main btn-withdraw" style="width:100%; padding:12px;" onclick="subW()">CONFIRM</button><button onclick="closeM('with-m')" style="color:#94a3b8; background:none; border:none; margin-top:15px; cursor:pointer;">CLOSE</button></div></div>
    <div id="trans-m" class="modal"><div class="modal-content" style="text-align:center;"><h2 style="color:var(--purple);">TRANSFER</h2><input type="tel" id="trans-phone" placeholder="የተቀባይ ስልክ (09...)"><input type="number" id="trans-amount" min="1" placeholder="የብር መጠን"><button class="btn-main btn-transfer" style="width:100%; padding:12px;" onclick="subTransfer()">SEND</button><button onclick="closeM('trans-m')" style="color:#94a3b8; background:none; border:none; margin-top:15px; cursor:pointer;">CLOSE</button></div></div>
    <div id="dep-m" class="modal"><div class="modal-content" style="text-align:center;"><h2 style="color:var(--green);">DEPOSIT</h2><p>ሰንድ ማድረግ በ: <b style="color:var(--gold);">0945880474</b></p><input type="number" id="da" min="10" placeholder="Amount"><input type="text" id="di" placeholder="Transaction ID"><button class="btn-main btn-deposit" style="width:100%" onclick="subD()">SUBMIT</button><button onclick="closeM('dep-m')" style="color:#94a3b8; background:none; border:none; margin-top:15px;">CLOSE</button></div></div>

    <div id="result-ui" class="winner-modal">
        <div class="winner-box">
            <div style="font-size: 2.5rem; margin-bottom: 5px;">🏆</div>
            <div class="winner-name-text" id="w-player-name"></div>
            <div style="background:#f1f5f9; border-radius:15px; padding:8px; margin:10px auto;"><span>Total Prize</span><br><b id="w-prize-pool" style="color:#10b981; font-size:1.3rem;">0 ETB</b></div>
            <div class="winner-grid-modern" id="w-grid-cells"></div>
        </div>
        <div class="next-round-bar">Next Round: <span id="w-next-timer">10s</span></div>
    </div>

    <script>
        let phone = localStorage.getItem('phone');
        let username = localStorage.getItem('username');
        let announced = false, lastBall = "--", clientBalance = 0;
        let socket = null;
        let latestDrawnBallsGlobal = []; 

        window.onload = function() {
            if (phone && phone.trim() !== "") {
                showGameUI();
            } else {
                showAuthUI();
            }
        }

        function showAuthUI() {
            document.getElementById('auth-ui').style.display = 'flex';
            document.getElementById('main-app-content').style.display = 'none';
        }

        // አፕልኬሽኑን ከባክግራውንድ ወደ ፊት ሲያመጡት ወይም ፔጁ ቪዚብል ሲሆን አውቶማቲክ ሪኮኔክት እንዲያደርግ
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "visible") {
                forceRecoveryRefresh();
            }
        });

        // ሪፍሬሽ በተን ሲጫን ወይም ከስታክ ሲመለስ ወዲያውኑ ሰርቨሩን እንዲያነጋግር የተደረገ ኃይለኛ ሪኮቨሪ ሲስተም
        function forceRecoveryRefresh() {
            if (!phone) return;
            if (socket) {
                try { socket.disconnect(); socket.connect(); } catch(e){}
            } else {
                initWebSocket();
            }
            fetch(`/get_status?phone=${encodeURIComponent(phone)}`)
            .then(r => r.json())
            .then(d => { applyGameStateData(d); }).catch(() => {});
        }

        function registerUser() {
            let inputName = document.getElementById('reg-username').value.trim();
            let inputPhone = document.getElementById('reg-phone').value.trim();
            if (inputName.length < 2) return alert("እባክዎ ትክክለኛ ስም ያስገቡ!");
            const cleanPhone = inputPhone.replace(/[^0-9+]/g, '');
            if (cleanPhone.length < 9) return alert("እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ!");

            fetch('/register_or_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: cleanPhone, username: inputName })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('phone', cleanPhone);
                    localStorage.setItem('username', inputName);
                    phone = cleanPhone; username = inputName;
                    showGameUI();
                } else {
                    alert(data.msg || "ስህተት አጋጥሟል!");
                }
            });
        }

        function showGameUI() {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('main-app-content').style.display = 'flex'; 
            fetchBalanceOnly();
            initWebSocket();
        }

        function fetchBalanceOnly() {
            if (!phone) return;
            fetch(`/get_status?phone=${encodeURIComponent(phone)}`)
            .then(r => r.json())
            .then(d => {
                if (d.balance !== undefined) {
                    clientBalance = parseFloat(d.balance) || 0;
                    document.getElementById('balance').innerText = clientBalance.toFixed(0) + " ETB";
                }
            }).catch(() => {});
        }

        function initWebSocket() {
            socket = io({
                reconnection: true,
                reconnectionAttempts: Infinity,
                reconnectionDelay: 500,
                timeout: 10000
            });

            socket.on('connect', function() {
                fetchBalanceOnly();
                forceRecoveryRefresh();
            });

            socket.on('balance_update', function(data) {
                if (data && data.phone === phone) {
                    clientBalance = parseFloat(data.balance) || 0;
                    document.getElementById('balance').innerText = clientBalance.toFixed(0) + " ETB";
                }
            });

            socket.on('game_update', function(d) {
                applyGameStateData(d);
            });
        }

        function applyGameStateData(d) {
            if (!d) return;
            let finalPrize = Math.floor((parseFloat(d.pot) || 0) * 0.8);
            document.getElementById('prize').innerText = finalPrize + " ETB";
            document.getElementById('p-count').innerText = parseInt(d.active_players) || 0;
            document.getElementById('timer').innerText = d.timer;
            
            if (d.balance !== undefined) {
                clientBalance = parseFloat(d.balance) || 0;
                document.getElementById('balance').innerText = clientBalance.toFixed(0) + " ETB";
            }

            if(d.status === "lobby") {
                document.getElementById('lobby-ui').style.display='flex'; 
                document.getElementById('game-ui').style.display='none'; 
                document.getElementById('result-ui').style.display='none';
                document.getElementById('main-board').innerHTML=""; 
                document.getElementById('card-area').innerHTML="";
                if (announced) { announced = false; }
                const bBtn = document.getElementById('bingo-btn'); if(bBtn) bBtn.disabled = false;
                initTicketsOnce(); 
                renderTickets(d.sold_tickets || {});
            } 
            else if(d.status === "playing") {
                document.getElementById('lobby-ui').style.display='none'; 
                document.getElementById('game-ui').style.display='flex'; 
                document.getElementById('result-ui').style.display='none';
                
                document.getElementById('ball-circle').innerText = d.current_ball;
                latestDrawnBallsGlobal = d.drawn_balls || [];
                renderMainBoard(latestDrawnBallsGlobal);

                let myCards = [];
                if (d.sold_tickets) {
                    for (let ticketId in d.sold_tickets) {
                        if (d.sold_tickets[ticketId] === phone) {
                            if (d.all_cards && d.all_cards[ticketId]) {
                                myCards.push({ id: ticketId, matrix: d.all_cards[ticketId] });
                            }
                        }
                    }
                }

                const cardArea = document.getElementById('card-area');
                if (cardArea) {
                    if (myCards.length > 0) {
                        if (cardArea.children.length === 0 || cardArea.querySelector('.waiting-box')) {
                            cardArea.innerHTML = "";
                            myCards.forEach((cObj) => { renderCard(cObj.matrix); }); 
                        }
                    } else {
                        if (!cardArea.querySelector('.waiting-box')) {
                            cardArea.innerHTML = `<div class="waiting-box"><span>ጨዋታዉ ተጀምሯል! እባክዎ ቀጣይ ዙር ይጠብቁ</span></div>`;
                        }
                    }
                }
            } 
            else if(d.status === "result") {
                let hasRealWinner = d.winner && !d.winner.includes("No Winner");
                if (!hasRealWinner) {
                    document.getElementById('result-ui').style.display = 'none';
                    return;
                }

                document.getElementById('result-ui').style.display='flex';
                // "haswon" ድግግሞሽ እንዳይኖር በሰርቨር የተስተካከለውን ስም ቀጥታ እናሳያለን
                document.getElementById('w-player-name').innerText = d.winner;
                document.getElementById('w-prize-pool').innerText = finalPrize + " ETB";
                document.getElementById('w-next-timer').innerText = d.timer + "s";

                const gridCells = document.getElementById('w-grid-cells');
                gridCells.innerHTML = ""; 
                let winCard = d.winning_card;
                if (Array.isArray(winCard)) {
                    let winIdxs = new Set(d.winning_indices || []);
                    winCard.forEach((n, idx) => {
                        let cell = document.createElement('div');
                        cell.className = "w-cell-modern";
                        cell.innerText = (idx === 12 || n === 0) ? "★" : n;
                        if (winIdxs.has(idx)) cell.className += " hit";
                        gridCells.appendChild(cell);
                    });
                }
                if(!announced) { try { document.getElementById('win-horn').play(); } catch(e){} announced = true; }
            }
        }

        function openM(id) { document.getElementById(id).style.display='flex'; }
        function closeM(id) { document.getElementById(id).style.display='none'; }

        function initTicketsOnce() {
            const area = document.getElementById('ticket-area');
            if(area && area.children.length === 0) { 
                const fragment = document.createDocumentFragment();
                for(let i=1; i<=500; i++) { 
                    let div=document.createElement('div'); div.className='t-box'; div.innerText=i; div.id='t-'+i; fragment.appendChild(div); 
                } 
                area.appendChild(fragment);
            }
        }

        function renderTickets(sold) {
            for(let i=1; i<=500; i++) {
                let box = document.getElementById('t-'+i); if(!box) continue;
                if(sold[i]) { 
                    const isMine = (sold[i] === phone);
                    box.className = isMine ? 't-box mine' : 't-box sold'; 
                    box.onclick = isMine ? () => refund(i) : null; 
                } else { 
                    box.className='t-box'; box.onclick=()=>buy(i); 
                }
            }
        }

        function buy(n) { 
            fetch('/buy_specific_ticket', {
                method:'POST', headers:{'Content-Type':'application/json'}, 
                body:JSON.stringify({phone: phone, ticket_num: n, username: username})
            }).then(res => res.json()).then(d => { if(d.success) fetchBalanceOnly(); }); 
        }

        function refund(n) { 
            if(confirm("ካርቴላውን ሰርዘው 10 ብር ይመለስልዎ?")) {
                fetch('/cancel_ticket', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone: phone, ticket_num: n}) })
                .then(() => { fetchBalanceOnly(); }); 
            }
        }
        
        function renderMainBoard(drawn) {
            const board = document.getElementById('main-board');
            if(board.children.length === 0) { 
                for(let col=0; col<5; col++) {
                    let colDiv = document.createElement('div'); colDiv.className = 'board-column';
                    let start = col * 15 + 1;
                    for(let i=start; i<=start+14; i++) {
                        let d = document.createElement('div'); d.className = 'ball-dot'; d.id = 'b-' + i; d.innerText = i;
                        colDiv.appendChild(d);
                    }
                    board.appendChild(colDiv);
                }
            }
            drawn.forEach(b => { let num = parseInt(String(b).replace(/[^0-9]/g, '')); if(!isNaN(num)) { let el = document.getElementById('b-'+num); if(el) el.className = 'ball-dot active'; } });
        }

        function renderCard(card) {
            const wrap = document.createElement('div'); wrap.style.margin="0 auto 4px auto"; wrap.style.width="100%";
            wrap.innerHTML = `<div style="display:grid;grid-template-columns:repeat(5,1fr);background:var(--orange);font-weight:900;padding:2px;font-size:0.7rem;border-radius:4px 4px 0 0;text-align:center;"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>`;
            const grid = document.createElement('div'); grid.className='bingo-card';
            card.forEach((n, i) => {
                const cell=document.createElement('div');
                if(i === 12 || parseInt(n) === 0) { 
                    cell.className="cell free selected"; cell.innerText="FREE"; 
                } else { 
                    cell.className = "cell"; cell.innerText = n; 
                    cell.onclick = () => { cell.classList.toggle('selected'); } 
                }
                grid.appendChild(cell);
            });
            wrap.appendChild(grid); document.getElementById('card-area').appendChild(wrap);
        }

        function claim() { 
            const bBtn = document.getElementById('bingo-btn'); if(bBtn) bBtn.disabled = true;
            fetch('/claim_bingo', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ phone: phone }) })
            .then(r => r.json()).then(d => { if(!d.success) { alert(d.msg); if(bBtn) bBtn.disabled = false; } }); 
        }

        function subD() {
            let amt = parseInt(document.getElementById('da').value), tid = document.getElementById('di').value.trim();
            if(!amt || !tid) return alert("መረጃዎችን በትክክል ያስገቡ!");
            fetch('/request_deposit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({phone: phone, amount: amt, transaction_id: tid}) })
            .then(() => { closeM('dep-m'); alert("የዲፖዚት ጥያቄዎ ተልኳል!"); });
        }
        function subW() {
            let amt = parseFloat(document.getElementById('wa').value);
            if(!amt || amt < 20) return alert("ቢያንስ 20 ETB ማውጣት ይችላሉ!");
            fetch('/request_withdrawal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: phone, amount: amt }) })
            .then(r => r.json()).then(res => { closeM('with-m'); alert(res.msg || "ጥያቄዎ ተልኳል!"); fetchBalanceOnly(); });
        }
        function subTransfer() {
            let receiverPh = document.getElementById('trans-phone').value.trim(), amt = parseFloat(document.getElementById('trans-amount').value);
            if(!receiverPh || isNaN(amt)) return alert("መረጃዎችን ይሙሉ!");
            fetch('/request_transfer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: phone, receiver_phone: receiverPh, amount: amt }) })
            .then(r => r.json()).then(res => { closeM('trans-m'); alert(res.msg || "ተከናውኗል!"); fetchBalanceOnly(); });
        }
    </script>
</body>
</html>
